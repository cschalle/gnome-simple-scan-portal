name: Flatpak

# Only code and build changes build a flatpak; README, notes and results do not.
on:
  push:
    branches: [main]
    paths:
      - 'final/**'
      - 'simple-scan/**'
      - '*.json'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'final/**'
      - 'simple-scan/**'
      - '*.json'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - org.gnome.SimpleScan.Portal.json
          - org.gnome.SimpleScan.PortalTest.json
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: simple-scan-${{ matrix.manifest }}.flatpak
          manifest-path: ${{ matrix.manifest }}
          cache-key: flatpak-builder-${{ matrix.manifest }}-${{ github.sha }}
          restore-cache: true
